<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Limpiando cache SENA</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: #eef3f0;
            color: #17231d;
        }
        .box {
            width: min(520px, calc(100vw - 32px));
            background: #fff;
            border: 1px solid #dde8e1;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 10px 30px rgba(23,35,29,.08);
        }
        h1 { margin: 0 0 8px; font-size: 22px; color: #238a4d; }
        p { line-height: 1.5; color: #66756d; }
        a {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 16px;
            border-radius: 7px;
            background: #238a4d;
            color: #fff;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Limpiando cache local</h1>
        <p>Se estan eliminando el service worker y los archivos guardados por el navegador. En unos segundos volveras al sistema.</p>
        <a href="/sena_aprendices/pages/dashboard.php?nocache=1">Ir al Dashboard</a>
    </div>
    <script>
        async function clean() {
            try {
                if ('serviceWorker' in navigator) {
                    const regs = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(regs.map(reg => reg.unregister()));
                }
                if ('caches' in window) {
                    const keys = await caches.keys();
                    await Promise.all(keys.map(key => caches.delete(key)));
                }
            } catch (e) {}
            setTimeout(() => {
                location.replace('/sena_aprendices/pages/dashboard.php?nocache=' + Date.now());
            }, 900);
        }
        clean();
    </script>
</body>
</html>
